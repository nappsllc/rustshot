[package]
name = "rustshot"
version = "0.1.0"
edition = "2024"
# Derivative of Flameshot (GPL-3.0): behavior and UI modeled on it.
license = "GPL-3.0-only"
description = "Screenshot and annotation tool (Flameshot-style, written in Rust)"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
arboard = "3"
eframe = { version = "0.27", default-features = false, features = ["glow"] }
egui = { version = "0.27", default-features = false }
global-hotkey = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_Networking_WinHttp",
    "Win32_System_SystemInformation",
] }
rfd = "0.15"
tiny-skia = "0.11"
xcap = "0.9.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
