name: release

# Push a tag matching Cargo.toml's version (e.g. `git tag v0.1.0 && git push
# origin v0.1.0`) to build all three platforms with the same jobs as ci.yml
# and publish every package to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    # macOS signing/notarization secrets, when configured.
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$v"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Give the bare Windows exe a versioned name
        run: |
          mv artifacts/rustshot-windows-x86_64/rustshot.exe \
             "artifacts/rustshot-windows-x86_64/rustshot-${GITHUB_REF_NAME#v}-windows-x86_64.exe"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts/*/*
          gh release create "$GITHUB_REF_NAME" \
            --title "rustshot $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*/*

  msstore:
    needs: publish
    if: vars.PUBLISH_MSSTORE == 'true'
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_SELLER_ID: ${{ vars.MSSTORE_SELLER_ID }}
      MSSTORE_APP_ID: ${{ vars.MSSTORE_APP_ID }}
    steps:
      - name: Require Store identity variables
        run: |
          if (-not $env:MSIX_IDENTITY_NAME -or -not $env:MSIX_PUBLISHER) {
            Write-Error "MSIX_IDENTITY_NAME and MSIX_PUBLISHER repository variables must be set; the .msix was built with the dev placeholder identity otherwise."
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rustshot-windows-msix
          path: artifacts
      - uses: microsoft/microsoft-store-apppublisher@v1
      - name: Submit to Partner Center
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          $pkg = Get-ChildItem artifacts\*.msix | Where-Object Name -notlike '*sideload*' | Select-Object -First 1
          msstore publish $PWD -i $pkg.FullName -id $env:MSSTORE_APP_ID

  winget:
    needs: publish
    if: vars.PUBLISH_WINGET == 'true'
    runs-on: windows-latest
    steps:
      - name: Open winget-pkgs PR
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/rustshot-$v-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update nappsllc.rustshot --version $v --urls $url --submit --token $env:WINGET_TOKEN

  snap:
    needs: publish
    if: vars.PUBLISH_SNAP == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustshot-snap
          path: artifacts
      - id: find
        run: echo "snap=$(ls artifacts/*.snap)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.find.outputs.snap }}
          release: edge

  aur:
    needs: publish
    if: vars.PUBLISH_AUR == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rustshot-linux
          path: artifacts
      - name: Render and push rustshot-bin
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm git openssh
          git config --global --add safe.directory '*'
          v="${GITHUB_REF_NAME#v}"
          sum=$(sha256sum "artifacts/rustshot-$v-linux-x86_64.tar.gz" | cut -d' ' -f1)
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur"
          git clone ssh://aur@aur.archlinux.org/rustshot-bin.git aur
          sed -e "s/@VERSION@/$v/" -e "s/@SHA256@/$sum/" packaging/aur/PKGBUILD.in > aur/PKGBUILD
          useradd -m builder
          chown -R builder aur
          (cd aur && su builder -c 'makepkg --printsrcinfo' > .SRCINFO)
          cd aur
          git config user.name "rustshot release"
          git config user.email "noreply@github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to $v"
          git push origin HEAD:master

  mas:
    needs: publish
    if: vars.PUBLISH_MAS == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustshot-macos
          path: artifacts
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          pkg=$(ls artifacts/*-mas.pkg 2>/dev/null | head -n1 || true)
          if [ -z "$pkg" ]; then
            echo "::error::No *-mas.pkg in artifact rustshot-macos (MAS signing secrets were not set when the build ran)"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f "$pkg" -t macos --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

  homebrew:
    needs: publish
    if: vars.PUBLISH_HOMEBREW == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rustshot-macos
          path: artifacts
      - name: Render cask
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          sum=$(sha256sum "artifacts/rustshot-$v-macos-universal.dmg" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$v/" -e "s/@SHA256@/$sum/" packaging/homebrew/rustshot.rb.in > "$RUNNER_TEMP/rustshot.rb"
      - uses: actions/checkout@v4
        with:
          repository: nappsllc/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push cask
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cp "$RUNNER_TEMP/rustshot.rb" tap/Casks/rustshot.rb
          cd tap
          git config user.name "rustshot release"
          git config user.email "noreply@github.com"
          git add Casks/rustshot.rb
          git commit -m "rustshot ${GITHUB_REF_NAME#v}"
          git push origin HEAD
