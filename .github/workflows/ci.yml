name: ci

on:
  push:
    branches: [main, handroll]
  pull_request:
    branches: [main, handroll]
  workflow_dispatch:
  # release.yml reuses these jobs to build the tagged artifacts.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install X11 headers and validators
        run: sudo apt-get update && sudo apt-get install -y libx11-dev desktop-file-utils appstream
      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.nappsllc.rustshot.desktop
          appstreamcli validate --no-net packaging/linux/io.github.nappsllc.rustshot.metainfo.xml
      - name: Flatpak cargo sources are up to date
        run: |
          python3 -m venv "$RUNNER_TEMP/fcg-venv" && "$RUNNER_TEMP/fcg-venv/bin/pip" install -q aiohttp tomlkit pyyaml
          curl -fsSL -o "$RUNNER_TEMP/fcg.py" \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          "$RUNNER_TEMP/fcg-venv/bin/python" "$RUNNER_TEMP/fcg.py" Cargo.lock -o "$RUNNER_TEMP/cargo-sources.json"
          diff -u packaging/flatpak/cargo-sources.json "$RUNNER_TEMP/cargo-sources.json" \
            || { echo "::error::regenerate packaging/flatpak/cargo-sources.json (see docs/STORES.md)"; exit 1; }
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Package (tarball, deb, AppImage)
        run: |
          bash packaging/linux/package.sh
          bash packaging/linux/deb.sh
          bash packaging/linux/appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rustshot-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: rustshot.flatpak
          manifest-path: packaging/flatpak/io.github.nappsllc.rustshot.yml
          cache-key: flatpak-builder-${{ github.sha }}

  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: rustshot-snap
          path: ${{ steps.build.outputs.snap }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash packaging/macos/bundle.sh
      # Mac App Store build — runs only when the MAS secrets are configured.
      - name: Mac App Store package
        env:
          MAS_APP_CERT_P12: ${{ secrets.MAS_APP_CERT_P12 }}
          MAS_INSTALLER_CERT_P12: ${{ secrets.MAS_INSTALLER_CERT_P12 }}
          MAS_CERT_PASSWORD: ${{ secrets.MAS_CERT_PASSWORD }}
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
          MAS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MAS_APP_CERT_P12" ]; then
            echo "MAS secrets not configured — skipping Mac App Store package"
            exit 0
          fi
          set -euo pipefail
          kc="$RUNNER_TEMP/mas-keychain"
          security create-keychain -p ci "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p ci "$kc"
          for v in MAS_APP_CERT_P12 MAS_INSTALLER_CERT_P12; do
            echo "${!v}" | base64 --decode > "$RUNNER_TEMP/$v.p12"
            security import "$RUNNER_TEMP/$v.p12" -k "$kc" -P "$MAS_CERT_PASSWORD"               -T /usr/bin/codesign -T /usr/bin/productbuild
            rm -f "$RUNNER_TEMP/$v.p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$kc"
          security list-keychains -d user -s "$kc"
          export MAS_APP_IDENTITY=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Apple Distribution[^"]*\)".*/\1/p' | head -n1)
          export MAS_INSTALLER_IDENTITY=$(security find-identity -v "$kc" | sed -n 's/.*"\(3rd Party Mac Developer Installer[^"]*\)".*/\1/p' | head -n1)
          export MAS_PROFILE="$RUNNER_TEMP/rustshot.provisionprofile"
          echo "$MAS_PROVISION_PROFILE" | base64 --decode > "$MAS_PROFILE"
          bash packaging/macos/mas.sh
          security delete-keychain "$kc"
      # Signs + notarizes when Apple secrets are configured in the repo;
      # without them the build stays unsigned (fine for local use — other
      # Macs need right-click → Open).
      - name: Sign and notarize
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "APPLE_CERT_P12 not configured — skipping code signing"
            exit 0
          fi
          set -euo pipefail
          p12="$RUNNER_TEMP/cert.p12"
          kc="$RUNNER_TEMP/ci-keychain"
          echo "$APPLE_CERT_P12" | base64 --decode > "$p12"
          security create-keychain -p ci "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p ci "$kc"
          security import "$p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$kc"
          security list-keychains -d user -s "$kc"
          id=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(.*\)".*/\1/p' | head -n1)
          echo "signing with: $id"
          codesign --force --options runtime --timestamp --sign "$id" dist/Rustshot.app
          ditto -c -k --keepParent dist/Rustshot.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Rustshot.app
          rm -f "$p12"
          security delete-keychain "$kc"
      - name: Package (zip + dmg)
        run: bash packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rustshot-macos
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*-mas.pkg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        # Live/display tests and the message-driven e2e suite stay local
        # (they need an interactive session): cargo test -- --ignored
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Installer
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DPRODUCT_VERSION=$v packaging\installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: rustshot-windows-x86_64
          path: target/release/rustshot.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rustshot-windows-installer
          path: dist/*-setup.exe
      - name: MSIX
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
          MSIX_SIGN_PFX: ${{ secrets.MSIX_SIGN_PFX }}
          MSIX_SIGN_PASSWORD: ${{ secrets.MSIX_SIGN_PASSWORD }}
        run: packaging\windows\msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rustshot-windows-msix
          path: dist/*.msix
