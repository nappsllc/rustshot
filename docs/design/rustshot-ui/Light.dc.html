<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rustshot overlay, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.lt{--sf:rgba(250,250,252,.97);--bd:rgba(0,0,0,.08);--sep:rgba(0,0,0,.10);--ic:#5F6473;--ich:#15171E;--hv:rgba(0,0,0,.06);--pr:rgba(0,0,0,.10);--ac:#5B63F5;--acbg:rgba(91,99,245,.12);--acbg2:rgba(91,99,245,.18);--acrg:rgba(91,99,245,.32);--acfg:#4047D6;--tx:#15171E;--tx2:#737889;--tip:rgba(22,23,28,.97);--tipx:#F2F3F6;--kbd:rgba(255,255,255,.14);--kbdx:#C4C7D0;--dgbg:rgba(220,38,38,.10);--dgfg:#C62828;--dim:rgba(7,8,11,.46);--s1:rgba(0,0,0,.14);--s2:rgba(0,0,0,.09);--s3:rgba(0,0,0,.05);--s4:rgba(0,0,0,.025);--rim:rgba(0,0,0,.18)}
.bt{box-sizing:border-box;width:32px;height:32px;border:0;padding:0;margin:0;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ic);cursor:pointer;flex:none}
.bt:hover{background:var(--hv);color:var(--ich)}
.bt.on{background:var(--acbg);color:var(--acfg);box-shadow:inset 0 0 0 1px var(--acrg)}
.bt.d{opacity:.34;cursor:default;pointer-events:none}
.bt.dg:hover{background:var(--dgbg);color:var(--dgfg)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.tb{box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:6px;background:var(--sf);border-radius:12px;color:var(--tx);box-shadow:inset 0 0 0 1px var(--bd),0 1px 0 0 var(--s1),0 3px 0 2px var(--s2),0 7px 0 5px var(--s3),0 12px 0 9px var(--s4)}
.g{display:flex;align-items:center;gap:2px}
.sp{width:1px;height:16px;background:var(--sep);flex:none}
.val{width:56px;height:32px;display:flex;align-items:center;justify-content:center;gap:4px;flex:none}
.v{font-size:12px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
.u{font-size:11px;font-weight:500;color:var(--tx2)}
.sw{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--rim);display:block}
.lb{box-sizing:border-box;height:22px;padding:0 8px;border-radius:6px;background:var(--sf);color:var(--tx);display:flex;align-items:center;gap:8px;box-shadow:inset 0 0 0 1px var(--bd),0 1px 0 0 var(--s1),0 3px 0 2px var(--s3)}
.ts{box-sizing:border-box;height:36px;padding:0 14px 0 10px;border-radius:12px;background:var(--sf);color:var(--tx);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;box-shadow:inset 0 0 0 1px var(--bd),0 1px 0 0 var(--s1),0 3px 0 2px var(--s2),0 7px 0 5px var(--s3),0 12px 0 9px var(--s4)}
.sb{position:absolute;left:-1px;top:-1px;right:-1px;bottom:-1px;border:1px solid var(--ac);box-shadow:0 0 0 1px rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.35);pointer-events:none}
.hd{position:absolute;box-sizing:content-box;width:6px;height:6px;border-radius:50%;background:#fff;border:2px solid var(--ac);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.nv{height:34px;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12px;font-weight:500;color:#5A6070}
.nv i{width:16px;height:16px;border-radius:5px;background:#BFC5D4;display:block}
.nv.a{background:#E1E3F7;color:#2B2F45}
.nv.a i{background:#8E96E8}
.cd{position:absolute;box-sizing:border-box;background:#fff;border:1px solid #E4E7EC;border-radius:10px}
</style>
</helmet>
<div class="lt" style="position:relative;width:1440px;height:900px;overflow:hidden;font-family:'Inter',system-ui,sans-serif">

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></symbol>
<symbol id="i-line" viewBox="0 0 24 24"><path d="M20 4 4 20"></path></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></symbol>
<symbol id="i-rect" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"></rect></symbol>
<symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></symbol>
<symbol id="i-marker" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"></path><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"></path></symbol>
<symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path></symbol>
<symbol id="i-pixel" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path><path d="M9 3v18"></path><path d="M15 3v18"></path></symbol>
<symbol id="i-invert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 18a6 6 0 0 0 0-12v12z"></path></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"></path></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"></path></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5v14"></path></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M12 13v8"></path><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="m8 17 4-4 4 4"></path></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></symbol>
<symbol id="i-okc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></symbol>
</defs></svg>

<!-- Captured screen (sample) -->
<div style="position:absolute;left:0;top:0;width:1440px;height:900px;background:linear-gradient(135deg,#DCE6F5 0%,#F3E4EE 100%)"></div>
<div style="position:absolute;left:120px;top:70px;width:1200px;height:720px;border-radius:12px;background:#F6F7F9;overflow:hidden;box-shadow:0 24px 60px rgba(30,40,70,.22)">
  <div style="position:absolute;left:0;top:0;width:1200px;height:40px;background:#fff;border-bottom:1px solid #E6E8ED;box-sizing:border-box">
    <div style="position:absolute;left:16px;top:12px;font-size:12px;font-weight:500;color:#4A4F5C">Dashboard</div>
  </div>
  <div style="position:absolute;left:0;top:40px;width:200px;height:680px;background:#EEF0F4;border-right:1px solid #E1E4EA;box-sizing:border-box;padding:20px 14px;display:flex;flex-direction:column;gap:6px">

  <div style="position:absolute;left:232px;top:62px;font-size:20px;font-weight:600;color:#1B1E27">Overview</div>
  <div style="position:absolute;left:232px;top:94px;width:300px;height:9px;border-radius:5px;background:#DADEE6"></div>
  <div class="cd" style="left:232px;top:130px;width:300px;height:96px"><div style="position:absolute;left:18px;top:16px;font-size:11px;font-weight:500;color:#7A8090">Revenue</div><div style="position:absolute;left:18px;top:42px;width:130px;height:22px;border-radius:6px;background:#1F2330"></div></div>
  <div class="cd" style="left:556px;top:130px;width:300px;height:96px"><div style="position:absolute;left:18px;top:16px;font-size:11px;font-weight:500;color:#7A8090">Sessions</div><div style="position:absolute;left:18px;top:42px;width:110px;height:22px;border-radius:6px;background:#1F2330"></div></div>
  <div class="cd" style="left:880px;top:130px;width:300px;height:96px"><div style="position:absolute;left:18px;top:16px;font-size:11px;font-weight:500;color:#7A8090">Conversion</div><div style="position:absolute;left:18px;top:42px;width:90px;height:22px;border-radius:6px;background:#1F2330"></div></div>
  <div class="cd" style="left:232px;top:250px;width:948px;height:440px">
    <div style="position:absolute;left:24px;top:20px;font-size:13px;font-weight:600;color:#1B1E27">Weekly trend</div>

      <path d="M40 90H908M40 150H908M40 210H908M40 270H908M40 330H908M40 390H908" stroke="#EEF0F4" stroke-width="1" fill="none"></path>

    </svg>

</div>

<!-- Overlay -->

  <div class="sb"></div>

<div class="lb" style="position:absolute;left:240px;top:110px"><span class="v">960 × 540</span><span class="u">240, 140</span></div>

<div class="tb" style="position:absolute;right:240px;top:690px">
  <div class="g">
    <button class="bt" aria-label="Pencil (P)"><svg class="ic"><use href="#i-pencil"></use></svg></button>
    <button class="bt" aria-label="Line (L)"><svg class="ic"><use href="#i-line"></use></svg></button>
    <button class="bt on" aria-label="Arrow (A)"><svg class="ic"><use href="#i-arrow"></use></svg></button>
    <button class="bt" aria-label="Rectangle (R)"><svg class="ic"><use href="#i-rect"></use></svg></button>
    <button class="bt" aria-label="Ellipse (E)"><svg class="ic"><use href="#i-circle"></use></svg></button>
    <button class="bt" aria-label="Marker (M)"><svg class="ic"><use href="#i-marker"></use></svg></button>
    <button class="bt" aria-label="Text (T)"><svg class="ic"><use href="#i-text"></use></svg></button>
    <button class="bt" aria-label="Pixelate (X)"><svg class="ic"><use href="#i-pixel"></use></svg></button>
    <button class="bt" aria-label="Invert (I)"><svg class="ic"><use href="#i-invert"></use></svg></button>
  </div>
  <div class="sp"></div>

    <button class="bt" aria-label="Upload (Ctrl+U)"><svg class="ic"><use href="#i-cloud"></use></svg></button>
    <button class="bt dg" aria-label="Close (Esc)"><svg class="ic"><use href="#i-x"></use></svg></button>

</div>

<div style="position:absolute;left:0;right:0;top:836px;display:flex;justify-content:center">
